# Tiny Tapeout project information
project:
  title:        "Protocol Doppelganger CMOS5L smoke test"
  author:       "Damir Wallener"
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Portable-core and Tiny Tapeout wrapper bring-up"
  language:     "Verilog"
  clock_hz:     50000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_dwallener_mindreader"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "mindreader_core.v"
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "smoke input 0"
  ui[1]: "smoke input 1"
  ui[2]: "smoke input 2"
  ui[3]: "smoke input 3"
  ui[4]: "smoke input 4"
  ui[5]: "smoke input 5"
  ui[6]: "smoke input 6"
  ui[7]: "smoke input 7"

  # Outputs
  uo[0]: "smoke output 0"
  uo[1]: "smoke output 1"
  uo[2]: "smoke output 2"
  uo[3]: "smoke output 3"
  uo[4]: "smoke output 4"
  uo[5]: "smoke output 5"
  uo[6]: "smoke output 6"
  uo[7]: "smoke output 7"

  # Bidirectional pins
  uio[0]: "smoke bidirectional 0"
  uio[1]: "smoke bidirectional 1"
  uio[2]: "smoke bidirectional 2"
  uio[3]: "smoke bidirectional 3"
  uio[4]: "smoke bidirectional 4"
  uio[5]: "smoke bidirectional 5"
  uio[6]: "smoke bidirectional 6"
  uio[7]: "smoke bidirectional 7"

# Do not change!
yaml_version: 6
