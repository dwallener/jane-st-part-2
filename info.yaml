# Tiny Tapeout project information
project:
  title:        "Protocol Doppelganger autonomous protocol mindreader"
  author:       "Damir Wallener"
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Passively infers unknown serial structure and safely impersonates a bounded learned peripheral"
  language:     "Verilog"
  clock_hz:     50000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_dwallener_mindreader"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "mindreader_core.v"
    - "passive_bus_profiler.v"
    - "serial_hypothesis_router.v"
    - "uart_symbol_hypothesis_seq.v"
    - "i2c_symbol_hypothesis.v"
    - "generic_event_framer.v"
    - "protocol_equivalence_classifier.v"
    - "protocol_knowledge_reporter.v"
    - "template_learner.v"
    - "mindreader_supervisor.v"
    - "spi_physical_learner.v"
    - "spi_transaction_decoder.v"
    - "dual_direction_learner.v"
    - "learned_model_promoter.v"
    - "template_spi_peripheral.v"
    - "spi_timing_guard.v"
    - "pin_contention_monitor.v"
    - "autonomous_spi_mindreader.v"
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "discover enable"
  ui[1]: "learn enable"
  ui[2]: "promote learned model"
  ui[3]: "ownership granted"
  ui[4]: "activate emulation"
  ui[5]: "revoke emulation"
  ui[6]: "clear fault"
  ui[7]: "status mode; contradiction with ui[4]"

  # Outputs
  uo[0]: "physical inference complete"
  uo[1]: "data direction resolved"
  uo[2]: "frozen model valid"
  uo[3]: "protocol drive enabled"
  uo[4]: "all-pin bus quiet"
  uo[5]: "timing admissible"
  uo[6]: "contention fault"
  uo[7]: "promotion rejected"

  # Bidirectional pins
  uio[0]: "anonymous protocol pin 0"
  uio[1]: "anonymous protocol pin 1"
  uio[2]: "anonymous protocol pin 2"
  uio[3]: "anonymous protocol pin 3"
  uio[4]: "anonymous protocol pin 4"
  uio[5]: "anonymous protocol pin 5"
  uio[6]: "anonymous protocol pin 6"
  uio[7]: "anonymous protocol pin 7"

# Do not change!
yaml_version: 6
